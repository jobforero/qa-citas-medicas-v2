name: CI/CD Pipeline - SonarCloud & JaCoCo

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Asignar permisos de ejecución a Maven Wrapper
        run: |
          cd backend-citas-fhir/backend-citas-fhir
          chmod +x mvnw

      - name: Ejecutar Pruebas y Generar Cobertura JaCoCo
        run: |
          cd backend-citas-fhir/backend-citas-fhir
          ./mvnw clean test jacoco:report

      - name: Analizar con SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend-citas-fhir/backend-citas-fhir
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar -Dsonar.projectKey=jobforero_qa-citas-medicas-v2 -Dsonar.organization=jobforero -Dsonar.host.url=https://sonarcloud.io -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml