# Nombre de la aplicación
quarkus.application.name=backend-citas-fhir

# Configuración de Conexión a MongoDB Compass (Local)
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=citas_medicas_db

# Habilitar CORS para recibir peticiones desde el frontend en React
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS

# Niveles de Log
quarkus.log.category."org.acme".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3}] (%t) %s%e%n